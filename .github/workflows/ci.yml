name: Verify LogSentinel
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: python -m unittest discover -s collector -v
      - run: docker compose config --quiet
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  opensearch-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: logsentinel-verification
      API_KEY: ci-synthetic-verification-only
      LOGSENTINEL_API_KEY: ci-synthetic-verification-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure OpenSearch host
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Build and start the real stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify collection through the dashboard proxy
        run: python scripts/verify_stack.py --expect-empty --state-file data/stack-verification.json
      - name: Recreate all containers and verify persisted state
        run: |
          docker compose up -d --force-recreate --wait --wait-timeout 180
          python scripts/verify_stack.py --resume --state-file data/stack-verification.json
      - name: Show container diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
      - name: Stop the verification stack
        if: always()
        run: docker compose down --volumes --remove-orphans
